<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SKM Electronics{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Segoe UI', Arial, sans-serif; color: #1e293b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="max-width: 560px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;">
          <!-- Header -->
          <tr>
            <td style="background-color: #0f172a; padding: 20px 28px; text-align: left;">
              <span style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 0.4px;">
                SKM Electronics
              </span>
              <span style="display: block; font-size: 11px; color: #94a3b8; margin-top: 2px;">
                Digital Business &amp; Industrial Electronics Platform
              </span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 28px; font-size: 14px; line-height: 1.6; color: #334155;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #f1f5f9; padding: 16px 28px; text-align: center; font-size: 12px; color: #64748b;">
              &copy; 2026 SKM Electronics. All rights reserved.<br />
              This is an automated notification. Please do not reply directly to this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
